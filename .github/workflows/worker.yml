# Worker (docs/SPEC.md section 17): claims queued jobs from Supabase and runs them, three regions in parallel (one per leg;
# claim_job uses FOR UPDATE SKIP LOCKED, so legs never take the same job; daily budgets are shared through the database ledger),
# within each service's free-tier budget (backend/nzsw/limits.py). Secrets: SUPABASE_DB_URL (worker role),
# LINZ_API_KEY, STATSNZ_ADE_KEY, STATSNZ_DATAFINDER_KEY.
name: worker
on:
  schedule:
    - cron: "*/15 * * * *"     # pick up jobs queued in the app
    - cron: "15 14 * * *"      # 03:15 NZDT: queue a climate top-up for each published region
  workflow_dispatch:
    inputs:
      region: { description: "Run steps for one region now (optional)", required: false }
      steps: { description: "Steps", required: false, default: "climate,census,publish" }
      slot: { description: "Manual slot (1 or 2): a run in another slot runs alongside", required: false, default: "1" }
# one scheduled run and one manually started run may overlap (at most six workers); claim_job gives each job to one worker
concurrency: { group: "worker-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', inputs.slot || '1') || 'scheduled' }}", cancel-in-progress: false }
permissions: { contents: read }
jobs:
  run:
    strategy:
      fail-fast: false
      matrix: { leg: [1, 2, 3] }       # parallel workers, each claiming different regions
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults: { run: { working-directory: backend } }
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      NZSW_DEADLINE_S: "6000"        # hand long imagery runs back to the queue well before the job timeout
      LINZ_API_KEY: ${{ secrets.LINZ_API_KEY }}
      STATSNZ_ADE_KEY: ${{ secrets.STATSNZ_ADE_KEY }}
      STATSNZ_DATAFINDER_KEY: ${{ secrets.STATSNZ_DATAFINDER_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-worker.txt }
      - run: pip install -r requirements-worker.txt
      - name: Limits tests
        if: matrix.leg == 1
        run: python tests/test_limits.py
      - name: Queue daily climate top-ups
        if: github.event.schedule == '15 14 * * *' && matrix.leg == 1
        run: python -m nzsw.cli enqueue-published
      - name: Run one region (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.region != '' && matrix.leg == 1
        run: python -m nzsw.cli run "${{ inputs.region }}" --steps "${{ inputs.steps }}"
      - name: Claim and run queued jobs
        run: |
          sleep $(( (${{ matrix.leg }} - 1) * 20 ))   # stagger the legs' first requests
          python -m nzsw.cli worker
