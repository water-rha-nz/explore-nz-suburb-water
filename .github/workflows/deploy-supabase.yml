# Deploy database migrations and Edge Functions to Supabase when they change on main (docs/SPEC.md section 27).
# Secrets live only in the "production" environment (SUPABASE_DB_PASSWORD, SUPABASE_ACCESS_TOKEN; variable
# SUPABASE_PROJECT_REF). Auth/config settings (config.toml) are never pushed from here: they stay in the dashboard.
name: Deploy Supabase
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**", "supabase/functions/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-supabase
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Supabase CLI (checksum verified)
        env:
          GH_TOKEN: ${{ github.token }}
          V: 3.2.0
        run: |
          gh release download "v$V" -R supabase/cli -p "supabase_${V}_linux_amd64.tar.gz" -p checksums.txt -D "$RUNNER_TEMP/cli"
          cd "$RUNNER_TEMP/cli" && grep " supabase_${V}_linux_amd64.tar.gz$" checksums.txt | sha256sum -c -
          tar -xzf "supabase_${V}_linux_amd64.tar.gz" supabase && echo "$RUNNER_TEMP/cli" >> "$GITHUB_PATH"
      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
      - name: Migrations (dry run)
        run: supabase db push --remote --dry-run -p "$SUPABASE_DB_PASSWORD"
      - name: Migrations
        run: supabase --yes db push --remote -p "$SUPABASE_DB_PASSWORD"
      - name: Function secrets
        env:
          REVIEW_TOKEN: ${{ secrets.REVIEW_TOKEN }}
        run: |
          # single-purpose key of the review-chips function (blind second review); never printed
          if [ -n "$REVIEW_TOKEN" ]; then supabase secrets set --project-ref "$PROJECT_REF" REVIEW_TOKEN="$REVIEW_TOKEN" >/dev/null && echo "review key set"; fi
      - name: Edge Functions
        run: |
          for d in supabase/functions/*/; do
            f=$(basename "$d"); [ "$f" = "_shared" ] && continue
            nv=""; [ -f "$d.no-verify-jwt" ] && nv="--no-verify-jwt"    # functions that check their own key
            echo "deploying $f $nv"; supabase --yes functions deploy "$f" --use-api --project-ref "$PROJECT_REF" $nv
          done
