# Example: build the worker image and publish it to GitHub Container Registry.
# Move to .github/workflows/build-worker.yml (needs a token with the `workflow` scope). See docs/SPEC.md section 17.4a.
name: build-worker
on:
  push:
    branches: [main]
    paths: ["backend/**", "index/**"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-worker:${{ github.sha }}
            ghcr.io/${{ github.repository }}-worker:latest
