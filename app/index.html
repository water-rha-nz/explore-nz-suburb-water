<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NZ Suburb Water Profiles</title>
<meta name="description" content="NZ Suburb Water Profiles: suburb-level data for residential water-demand analysis in Aotearoa New Zealand (pools, gardens, sections, census, climate, water charges).">
<style>
:root{--bg:#f5f6f4;--panel:#fff;--ink:#1b1e21;--muted:#5f656b;--line:#dfe1dc;--accent:#0b6bcb;--accent-ink:#fff;--accent-soft:#e3effb;
--ok:#1a7f4b;--ok-bg:#e2f3e9;--bad:#b42318;--bad-bg:#fde7e5;--warn:#8a5a00;--warn-bg:#fcf0d4;
--s1:#deebf7;--s2:#9ecae1;--s3:#4292c6;--s4:#08519c;--s5:#08306b;--land:#eceee9;--landline:#c9cdc4;--rain:#3d7cc9;--et0:#d9822b;--temp:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121416;--panel:#1b1e21;--ink:#e7e8e6;--muted:#9aa0a6;--line:#2c3035;--accent:#5aa4f0;--accent-ink:#0b1a2a;--accent-soft:#16283b;
--ok:#5fd394;--ok-bg:#15301f;--bad:#ff8a80;--bad-bg:#3a1916;--warn:#f2c46b;--warn-bg:#3a2d11;
--s1:#16324a;--s2:#1f5a86;--s3:#3a86c4;--s4:#7ab8ea;--s5:#c6e2fb;--land:#23272b;--landline:#3a3f45;--rain:#6aa6ec;--et0:#f0a35a;--temp:#ff7a6b}}
:root[data-theme="dark"]{--bg:#121416;--panel:#1b1e21;--ink:#e7e8e6;--muted:#9aa0a6;--line:#2c3035;--accent:#5aa4f0;--accent-ink:#0b1a2a;--accent-soft:#16283b;
--ok:#5fd394;--ok-bg:#15301f;--bad:#ff8a80;--bad-bg:#3a1916;--warn:#f2c46b;--warn-bg:#3a2d11;
--s1:#16324a;--s2:#1f5a86;--s3:#3a86c4;--s4:#7ab8ea;--s5:#c6e2fb;--land:#23272b;--landline:#3a3f45;--rain:#6aa6ec;--et0:#f0a35a;--temp:#ff7a6b}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.02rem;margin-right:6px}
.badge{font-size:.72rem;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--warn-bg);color:var(--warn)}
.spacer{flex:1}
select,button,input{font:inherit;color:var(--ink)}
select,input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.9rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
nav.stages{max-width:1240px;margin:0 auto;padding:0 16px 8px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
nav.stages button{flex:0 0 auto;border:1px solid transparent;background:none;border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted);font-size:.9rem;white-space:nowrap}
nav.stages button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft);font-weight:600}
nav.stages button .n{display:inline-block;width:1.4em;font-variant-numeric:tabular-nums}
main{max-width:1240px;margin:0 auto;padding:18px 16px 64px}
h1{font-size:1.45rem;margin:0 0 4px}h2{font-size:1.12rem;margin:26px 0 10px}h3{font-size:.98rem;margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 16px;max-width:860px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi b{display:block;font-size:1.45rem;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi span{color:var(--muted);font-size:.8rem}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.86rem;width:100%}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
td.l,th.l{text-align:left}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:.76rem;font-weight:600}
.ok{background:var(--ok-bg);color:var(--ok)}.bad{background:var(--bad-bg);color:var(--bad)}.warn{background:var(--warn-bg);color:var(--warn)}.info{background:var(--accent-soft);color:var(--accent)}
.note{border-left:3px solid var(--accent);padding:8px 12px;background:var(--panel);border-radius:0 8px 8px 0;font-size:.88rem;margin:0 0 14px}
.muted{color:var(--muted)}.small{font-size:.84rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
svg text{fill:var(--muted);font-size:11px;font-family:inherit}
.map svg{width:100%;height:auto;display:block}
.map path.sub{stroke:var(--panel);stroke-width:1.2;cursor:pointer}
.map path.sub:hover,.map path.sub.sel{stroke:var(--ink);stroke-width:2}
.map path.sa2{fill:none;stroke:var(--ink);stroke-opacity:.45;stroke-dasharray:3 3;stroke-width:1;pointer-events:none}
.legend{display:flex;gap:4px;align-items:center;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:22px;height:10px;border-radius:2px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:7px;font-size:.8rem;opacity:0;transition:opacity .12s;z-index:30;max-width:260px}
.tip.show{opacity:.95}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px}
.key{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;background:var(--panel)}
.key kbd{display:block;font-size:1.15rem;font-family:inherit}
.k-up{grid-column:2}.k-left{grid-column:1;grid-row:2}.k-down{grid-column:2;grid-row:2}.k-right{grid-column:3;grid-row:2}
.job{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.job:last-child{border-bottom:none}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:.78rem;max-height:240px;margin:8px 0 0}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.gbtn{display:flex;align-items:center;gap:10px;justify-content:center;width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;background:var(--panel);cursor:pointer}
.locked{border:1px dashed var(--line);border-radius:10px;padding:14px;color:var(--muted);font-size:.88rem}
.dl-row{display:grid;grid-template-columns:150px minmax(0,1fr) 230px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.dl-row:last-child{border-bottom:none}
@media (max-width:700px){.dl-row{grid-template-columns:1fr}}
.bar-out{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.bar-in{height:100%;background:var(--accent);transition:width .3s}
.dl-row input[type=range]{width:100%}
footer{max-width:1240px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:.8rem}
[hidden]{display:none!important}
@media (max-width:600px){.bar{gap:8px}.brand{width:100%}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="brand">NZ Suburb Water Profiles</span>
    <span class="badge" style="background:var(--ok-bg);color:var(--ok)">Live</span>
    <label class="small muted">Region <select id="region"></select></label>
    <span class="spacer"></span>
    <span id="who" class="small"></span>
        <button class="btn" id="signin" type="button">Sign in with Google</button>
    <button class="btn" id="theme" type="button" aria-label="Toggle colour theme">◐</button>
  </div>
  <nav class="stages" id="stages" role="tablist" aria-label="Stages"></nav>
</header>

<main id="main"><p class="muted">Checking sign-in…</p></main>
<div class="tip" id="tip" role="tooltip"></div>

<dialog id="signin-dlg">
  <form method="dialog">
    <h3>Sign in (demo)</h3>
    <p class="small muted">The real app uses Supabase Auth with Google OAuth; your role comes from the <code>profiles</code> table and every query is filtered by row-level security. Here you pick a role to see what each one can do.</p>
    <button class="gbtn" value="google" type="submit">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.2l7.9 6.1C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
      Continue with Google (simulated)
    </button>
    <p style="margin:14px 0 6px"><label>Role <select id="role-pick">
      <option value="viewer">viewer: browse and export published regions</option>
      <option value="labeller">labeller: viewer plus validation labelling</option>
      <option value="editor">editor: labeller plus pipelines, allocation, rates, publish</option>
      <option value="admin">admin: everything, users and schedules</option>
    </select></label></p>
    <div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" type="submit">Cancel</button></div>
  </form>
</dialog>

<footer id="foot"></footer>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (v, d = 0) => v == null || Number.isNaN(v) ? "–" : Number(v).toLocaleString("en-NZ", { maximumFractionDigits: d, minimumFractionDigits: 0 });
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const RANK = { viewer: 1, labeller: 2, editor: 3, admin: 4 };
const STAGES = [["region", "Region"], ["load", "Load"], ["allocate", "Allocate"], ["imagery", "Imagery"], ["validate", "Validate"], ["context", "Context"], ["explore", "Explore"], ["export", "Export"]];
const REPO = "https://github.com/water-rha-nz/explore-nz-suburb-water";
let D = null, SECT = null, region = store.get("region", "taupo"), stage = store.get("stage", "region");
let user = null; try { user = JSON.parse(store.get("user", "null")); } catch (e) {}
let edits = {}; try { edits = JSON.parse(store.get("edits", "{}")) || {}; } catch (e) {}
let jobs = []; try { jobs = JSON.parse(store.get("jobs", "[]")) || []; } catch (e) {}
const can = (r) => user && RANK[user.role] >= RANK[r];
const R = () => D.regions[region];
const mName = (s) => (edits[region + ":" + s.linz_id]) || s.name;

// ---------- metrics catalogue (paper variables, DWU excluded) ----------
const C23 = (k) => (s) => s.census && s.census["2023"] ? s.census["2023"][k] : null;
const METRICS = [
  { id: "PercPool", label: "Sections with a pool (%)", get: (s) => s.PercPool, d: 1, src: "Imagery" },
  { id: "GardSize", label: "Median garden (vegetated) m²", get: (s) => s.GardSize, d: 0, src: "Imagery" },
  { id: "GardPct", label: "Median % of section vegetated", get: (s) => s.GardPct, d: 1, src: "Imagery" },
  { id: "LotSize", label: "Median section m²", get: (s) => s.LotSize, d: 0, src: "LINZ" },
  { id: "Footprint", label: "Median roof footprint m²", get: (s) => s.Footprint, d: 0, src: "LINZ" },
  { id: "ImperviousProxy", label: "Median impervious proxy m²", get: (s) => s.ImperviousProxy, d: 0, src: "LINZ + imagery" },
  { id: "SharedPct", label: "Shared sections (%)", get: (s) => s.SharedPct, d: 1, src: "LINZ titles" },
  { id: "HhSize", label: "Household size (2023)", get: C23("hh_size_mean"), d: 2, src: "Stats NZ" },
  { id: "Income", label: "Median household income $ (2023)", get: C23("income_median"), d: 0, src: "Stats NZ" },
  { id: "BRooms", label: "Mean bedrooms (2023)", get: C23("bedrooms_mean_all"), d: 2, src: "Stats NZ" },
  { id: "Owner", label: "Owner-occupied % (2023)", get: C23("pct_owner_all"), d: 1, src: "Stats NZ" },
  { id: "PctDetached", label: "Separate houses % (2023)", get: C23("pct_separate"), d: 1, src: "Stats NZ" },
  { id: "PctJoined", label: "Joined dwellings % (2023)", get: C23("pct_joined"), d: 1, src: "Stats NZ" },
  { id: "Rain", label: "Annual rain mm (2008–2025)", get: (s) => s.climate_annual && s.climate_annual.rain_mm, d: 0, src: "Open-Meteo" },
  { id: "ET0", label: "Annual ET0 mm (2008–2025)", get: (s) => s.climate_annual && s.climate_annual.et0_mm, d: 0, src: "Open-Meteo" },
  { id: "Temp", label: "Mean temperature °C", get: (s) => s.climate_annual && s.climate_annual.tmean_c, d: 1, src: "Open-Meteo" },
  { id: "Density", label: "Titles per km²", get: (s) => s.density_per_km2, d: 0, src: "LINZ" },
];
const M = Object.fromEntries(METRICS.map((m) => [m.id, m]));
const resident = (s) => s.sections != null;

// ---------- tiny SVG chart kit ----------
const ramp = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)"];
function classify(vals) {
  const v = vals.filter((x) => x != null).sort((a, b) => a - b);
  if (!v.length) return () => "var(--land)";
  const q = [0.2, 0.4, 0.6, 0.8].map((p) => v[Math.min(v.length - 1, Math.floor(p * v.length))]);
  return (x) => x == null ? "var(--land)" : ramp[q.filter((t) => x > t).length];
}
function mapSVG(feats, opts = {}) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const f of feats) for (const poly of f.geom) for (const ring of poly) for (const [x, y] of ring) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const W = 640, pad = 8, sc = (W - 2 * pad) / Math.max(x1 - x0, y1 - y0) * (x1 - x0 >= y1 - y0 ? 1 : 1);
  const H = Math.round((y1 - y0) * sc + 2 * pad), Wd = Math.round((x1 - x0) * sc + 2 * pad);
  const P = (ring) => ring.map(([x, y], i) => (i ? "L" : "M") + ((x - x0) * sc + pad).toFixed(1) + "," + ((y1 - y) * sc + pad).toFixed(1)).join("") + "Z";
  const paths = feats.map((f, i) => `<path class="${f.cls || "sub"}" data-i="${i}" fill="${f.fill || "none"}" d="${f.geom.map((p) => p.map(P).join("")).join("")}"><title>${esc(f.title || "")}</title></path>`).join("");
  const extra = (opts.overlay || []).map((f) => `<path class="sa2" d="${f.geom.map((p) => p.map(P).join("")).join("")}"/>`).join("");
  return `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="${esc(opts.label || "Map")}">${paths}${extra}</svg>`;
}
function bars(series, opts) { // series: [{v, label}], optional line [{v}]
  const W = 640, H = opts.h || 200, L = 40, B = 24, T = 10, n = series.length;
  const vmax = Math.max(1, ...series.map((s) => s.v || 0), ...(opts.line || []).map((s) => s.v || 0));
  const bw = (W - L - 8) / n, y = (v) => T + (H - T - B) * (1 - v / vmax);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label)}">`;
  for (let k = 0; k <= 4; k++) { const v = vmax * k / 4; s += `<line x1="${L}" x2="${W - 8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 4}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`; }
  series.forEach((d, i) => { const h = (H - T - B) * (d.v || 0) / vmax; s += `<rect x="${L + i * bw + bw * 0.12}" y="${y(d.v || 0)}" width="${bw * 0.76}" height="${h}" fill="${opts.color || "var(--rain)"}"><title>${esc(d.label)}: ${fmt(d.v, 1)}</title></rect>`; if (opts.every ? i % opts.every === 0 : true) s += `<text x="${L + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(d.short ?? d.label)}</text>`; });
  if (opts.line) s += `<polyline fill="none" stroke="${opts.lineColor || "var(--et0)"}" stroke-width="2" points="${opts.line.map((d, i) => `${L + i * bw + bw / 2},${y(d.v || 0)}`).join(" ")}"/>`;
  return s + "</svg>";
}
function line(vals, opts) {
  const W = 640, H = opts.h || 160, L = 40, B = 22, T = 8, n = vals.length;
  const vmax = Math.max(1, ...vals.filter((v) => v != null)), x = (i) => L + (W - L - 8) * i / Math.max(1, n - 1), y = (v) => T + (H - T - B) * (1 - v / vmax);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label)}">`;
  for (let k = 0; k <= 3; k++) { const v = vmax * k / 3; s += `<line x1="${L}" x2="${W - 8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 4}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`; }
  (opts.ticks || []).forEach(([i, t]) => { s += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(t)}</text>`; });
  if (opts.bars) vals.forEach((v, i) => { if (v) s += `<line x1="${x(i)}" x2="${x(i)}" y1="${y(0)}" y2="${y(v)}" stroke="${opts.color}" stroke-width="1.2"/>`; });
  else s += `<polyline fill="none" stroke="${opts.color}" stroke-width="1.5" points="${vals.map((v, i) => v == null ? "" : `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}"/>`;
  return s + "</svg>";
}
function scatter(pts, xl, yl) {
  const W = 640, H = 300, L = 54, B = 38, T = 10, R2 = 14;
  const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
  const [xa, xb] = [Math.min(...xs), Math.max(...xs)], [ya, yb] = [Math.min(...ys), Math.max(...ys)];
  const px = (v) => L + (W - L - R2) * (xb === xa ? 0.5 : (v - xa) / (xb - xa)), py = (v) => T + (H - T - B) * (yb === ya ? 0.5 : 1 - (v - ya) / (yb - ya));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(yl)} against ${esc(xl)}">`;
  for (let k = 0; k <= 4; k++) { const vx = xa + (xb - xa) * k / 4, vy = ya + (yb - ya) * k / 4;
    s += `<line x1="${px(vx)}" x2="${px(vx)}" y1="${T}" y2="${H - B}" stroke="var(--line)"/><text x="${px(vx)}" y="${H - B + 14}" text-anchor="middle">${fmt(vx, 1)}</text>`;
    s += `<line x1="${L}" x2="${W - R2}" y1="${py(vy)}" y2="${py(vy)}" stroke="var(--line)"/><text x="${L - 4}" y="${py(vy) + 4}" text-anchor="end">${fmt(vy, 1)}</text>`; }
  s += `<text x="${(L + W) / 2}" y="${H - 4}" text-anchor="middle">${esc(xl)}</text>`;
  pts.forEach((p) => { s += `<circle cx="${px(p.x)}" cy="${py(p.y)}" r="${Math.max(4, Math.min(14, Math.sqrt(p.n || 100) / 5))}" fill="${p.c}" fill-opacity=".75" stroke="var(--panel)"><title>${esc(p.label)}: ${fmt(p.x, 1)}, ${fmt(p.y, 1)}</title></circle>`; });
  return s + "</svg>";
}
function nzMap() {
  const r = D.nz_regions; if (!r) return "";
  const KX = Math.cos(41 * Math.PI / 180), q = r.q, W = 300;
  const rings = []; let x0 = 180, x1 = 160, y0 = 0, y1 = -60;

function parseCSV(text) {

    else if (c === '"') q = true; else if (c === ",") { row.push(f); f = ""; } else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; } else f += c; }
  if (f || row.length) { row.push(f); rows.push(row); }

}

    if (!(task === "pool" ? POOL_LABELS : task === "garden" ? GARDEN_LABELS : []).includes(lab)) e.push(`LABEL "${lab}" not allowed for ${task || "?"}`);
    if (!col(r, "LABELLER")) e.push("LABELLER empty"); if (Number.isNaN(Date.parse(col(r, "LABELLED_AT")))) e.push("LABELLED_AT not a date-time");

  if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch (_) { /* keep message */ } throw new Error(m); }
  const res = await q(sb.rpc("ta_suburbs", { p_ta: c, p_tol: 20 }));

}

  for (const r of BATCH.files.map || []) add(r.PROVIDER, "nz_suburb_map.csv");
  for (const r of BATCH.files.ref || []) add(r.PRVDR || r.PROVIDER, "nz_suburb_ref.csv");
  for (const k of Object.keys(BATCH.matches)) if (!m.has(k)) m.set(k, { code: k.toUpperCase(), rows: 0, files: new Set(["saved match"]) });
  return [...m.entries()].map(([k, e]) => ({ key: k, ...e, mine: BATCH.matches[k] || "", saved: prvdrCode(e.code) })).sort((a, b) => (!!(a.mine || a.saved) - !!(b.mine || b.saved)) || a.code.localeCompare(b.code));

function importBuilder(c, fname) {

async function queueBatch() {

  for (const c of sel) {
    const t = taOf(c), r = v[c], s = sc[c], p = prvdrFor(c);

      const rows = s.rows.flatMap((x) => (to.get(norm(x.linz_ref)) || to.get(norm(x.m_suburb)) || []).map((ln) => ({ region_id: id, m_suburb: x.m_suburb, m_territory: x.territory || t.name, prvdr: x.prvdr || p, other_spellings: x.spellings || null, linz_ref: ln, source_file: x.file })));
      if (rows.length) await q(sb.from("m_suburbs").insert(rows));

async function tileCSV(batchId) {
  const regs = BATCH.regions.filter((r) => r.batch_id === batchId).map((r) => r.id);
  const rows = regs.length ? await q(sb.from("imagery_tiles").select("region_id,capture_id,tile_id,cog_url,stac_url,processed_at").in("region_id", regs).order("region_id")) : [];
  if (!rows.length) return toastMsg("No tiles indexed yet: the imagery step lists them when it runs");
  download(`tiles_batch_${batchId}.csv`, csv([["REGION", "CAPTURE_ID", "TILE_ID", "COG_URL", "STAC_URL", "PROCESSED_AT"], ...rows.map((r) => [r.region_id, r.capture_id, r.tile_id, r.cog_url, r.stac_url, r.processed_at || ""])]));
}

// ---------------------------------------------------------------- events
document.addEventListener("click", async (e) => {
  const t = e.target, cl = (s) => t.closest && t.closest(s);
  const tab = cl("[data-btab]"); if (tab && isB()) { stage = tab.dataset.btab; store.set("stage", stage); BATCH.view = null; render(); return scrollTo(0, 0); }
  const as = cl("[data-asub]"); if (as && stage === "allocate" && BATCH.aPick && !window._dragMoved) { const r = curAllocRows().find((x) => x.key === BATCH.aPick); if (r) { const cur = ((r.alloc && r.alloc.linzSuburbs) || []).map((x) => x.name), n = as.dataset.asub;
    setAlloc(r, cur.some((x) => norm(x) === norm(n)) ? cur.filter((x) => norm(x) !== norm(n)) : [...cur, n]); BATCH.aPick = r.key; } return drawBatch(); }
  const ta = cl("[data-ta]"); if (ta && stage === "configure" && !window._dragMoved) { const c = ta.dataset.ta; BATCH.sel.has(c) ? BATCH.sel.delete(c) : BATCH.sel.add(c); saveSel(); BATCH.valid = {}; return drawBatch(); }
  const z = cl("[data-zoom]");
  if (z) { const svg = z.closest(".zmap").querySelector("svg"), b = svg.getAttribute("viewBox").split(" ").map(Number), act = z.dataset.zoom;
    if (act === "reset") return setView(svg, svg.dataset.full.split(" ").map(Number));
    if (act === "sel") { const id = z.closest(".zmap").dataset.zmap;
      const g = id === "cfg" ? [...BATCH.sel].map((c) => taOf(c).geom && taOf(c).geom.coordinates).filter(Boolean)
        : id.startsWith("alc-") ? (((BATCH.linz[id.slice(4)] || {}).list) || []).filter((x) => allocRows(id.slice(4)).some((r) => ((r.alloc && r.alloc.linzSuburbs) || []).some((y) => norm(y.name) === norm(x.name)))).map((x) => x.geom.coordinates)
        : ((BATCH.valid[id.slice(4)] || {}).matched || []).map((m) => m.linz.geom.coordinates);
      return g.length ? setView(svg, mapBox(g)) : setView(svg, svg.dataset.full.split(" ").map(Number)); }
    const k = act === "in" ? 0.7 : 1 / 0.7, w = b[2] * k, h = b[3] * k; return setView(svg, [b[0] + (b[2] - w) / 2, b[1] + (b[3] - h) / 2, w, h]); }
  const vr = cl("[data-vta]"); if (vr) { BATCH.vTA = vr.dataset.vta; BATCH.view = null; return drawBatch(); }
  if (t.dataset && t.dataset.ata) { BATCH.aTA = t.dataset.ata; BATCH.aPick = null; BATCH.view = null; return drawBatch(); }
  if (t.dataset && t.dataset.alinz) { t.disabled = true; try { await ensureLinz(t.dataset.alinz); } catch (err) { toastMsg("LINZ suburbs: " + err.message); } return drawBatch(); }
  if (t.id === "alinz-all") { t.disabled = true; for (const c of [...BATCH.sel].sort()) { try { await ensureLinz(c); } catch (err) { toastMsg(`${taOf(c).name}: ${err.message}`); } drawBatch(); } return; }
  if (t.dataset && (t.dataset.aadd || t.dataset.adel || t.dataset.apick)) { const rows = curAllocRows(), r = rows[+(t.dataset.aadd || t.dataset.adel || t.dataset.apick)]; if (!r) return;
    if (t.dataset.apick) { BATCH.aPick = BATCH.aPick === r.key ? null : r.key; return drawBatch(); }
    const cur = ((r.alloc && r.alloc.linzSuburbs) || []).map((x) => x.name);
    if (t.dataset.adel) { setAlloc(r, cur.filter((x) => x !== t.dataset.aname)); return drawBatch(); }
    const inp = $(`[data-ain="${t.dataset.aadd}"]`), n = t.dataset.aname || (inp && inp.value.trim()), L = (BATCH.linz[BATCH.aTA && BATCH.sel.has(BATCH.aTA) ? BATCH.aTA : [...BATCH.sel].sort()[0]] || {}).list || [];
    const hit = L.find((x) => norm(x.name) === norm(n)); if (!hit) return toastMsg(`"${n || ""}" is not a LINZ suburb in this TA`);
    if (!cur.includes(hit.name)) setAlloc(r, [...cur, hit.name]); return drawBatch(); }
  if (t.id === "apick-done") { BATCH.aPick = null; return drawBatch(); }
  if (t.dataset && t.dataset.punmatch) { delete BATCH.matches[t.dataset.punmatch]; BATCH.valid = {}; saveSel(); return drawBatch(); }
  if (t.id === "bcfg-export") return exportBuilder();
  if (t.dataset && t.dataset.tprvdrReset) { delete BATCH.prvdr[t.dataset.tprvdrReset]; saveSel(); return drawBatch(); }
  if (t.dataset && t.dataset.tunsel) { BATCH.sel.delete(t.dataset.tunsel); saveSel(); return drawBatch(); }
  if (t.dataset && t.dataset.sclear) { delete BATCH.files[t.dataset.sclear]; delete BATCH.fileNames[t.dataset.sclear]; BATCH.valid = {}; return drawBatch(); }
  if (t.id === "sel-found") { for (const c of tasInFiles()) BATCH.sel.add(c); saveSel(); BATCH.valid = {}; return drawBatch(); }
  if (t.id === "batch-clear") { BATCH.sel.clear(); BATCH.valid = {}; saveSel(); return drawBatch(); }
  if (t.id === "bta-all" || t.id === "bta-none") { const f = norm(store.get("bta-filter", "")); for (const x of BATCH.tas) if (!f || norm([x.name, (x.prvdrs || []).join(" "), x.rc].join(" ")).includes(f)) t.id === "bta-all" ? BATCH.sel.add(x.code) : BATCH.sel.delete(x.code); saveSel(); BATCH.valid = {}; return drawBatch(); }
  if (t.id === "validate-go" && can("editor")) { t.disabled = true; try { await validateAll(); } finally { t.disabled = false; } return; }
  if (t.id === "batch-queue" && can("editor")) { t.disabled = true; try { await queueBatch(); } catch (err) { toastMsg("Not queued: " + err.message); t.disabled = false; } return; }
  if (t.id === "cfg-save" && can("editor")) { try { await saveConfig(); } catch (err) { toastMsg("Not saved: " + err.message); } return; }
  if (t.id === "cfg-del" && BATCH.config && confirm(`Delete configuration "${BATCH.config.name}"?`)) { try { await q(sb.from("batch_configs").delete().eq("id", BATCH.config.id)); BATCH.config = null; await loadBatchData(); drawBatch(); } catch (err) { toastMsg(err.message); } return; }
  if (t.id === "batch-refresh") { await loadBatchData(); return drawBatch(); }
  if (t.dataset && t.dataset.tiles) return tileCSV(+t.dataset.tiles).catch((err) => toastMsg(err.message));
  if (t.dataset && t.dataset.publish && can("editor")) { try { await q(sb.from("regions").update({ status: "published" }).eq("id", t.dataset.publish)); toastMsg("Published: reload to add it to the region list"); await loadBatchData(); drawBatch(); } catch (err) { toastMsg(err.message); } }
});
document.addEventListener("change", async (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.tsel) { t.checked ? BATCH.sel.add(t.dataset.tsel) : BATCH.sel.delete(t.dataset.tsel); saveSel(); BATCH.valid = {}; return drawBatch(); }
  if (t.dataset && t.dataset.tprvdr) { BATCH.prvdr[t.dataset.tprvdr] = t.value; saveSel(); return drawBatch(); }
  if (t.id === "batch-keep") { BATCH.keep = t.value; store.set("batch-keep", t.value); BATCH.valid = {}; return drawBatch(); }
  if (t.id === "cfg-pick") return loadConfig(t.value);
  if (t.dataset && t.dataset.pmatch !== undefined) { t.value ? BATCH.matches[t.dataset.pmatch] = t.value : delete BATCH.matches[t.dataset.pmatch]; BATCH.valid = {}; saveSel(); return drawBatch(); }
  if (t.id === "bcfg-import" && t.files && t.files[0]) { const f = t.files[0];
    try { toastMsg(importBuilder(JSON.parse(await f.text()), f.name)); } catch (err) { toastMsg(err instanceof SyntaxError ? `${f.name} is not valid JSON` : err.message); } return drawBatch(); }
  if (t.dataset && t.dataset.sfile && t.files && t.files[0]) {
    BATCH.files[t.dataset.sfile] = readCSV(await t.files[0].text()); BATCH.fileNames[t.dataset.sfile] = t.files[0].name; BATCH.savedScope = null; BATCH.valid = {};
    toastMsg(`${BATCH.files[t.dataset.sfile].length} rows read; applied to ${Object.keys(scopeByTA()).length} selected TA(s)`); return drawBatch();
  }
});
document.addEventListener("input", (e) => { if (e.target.id === "bta-filter") { store.set("bta-filter", e.target.value); clearTimeout(window._bf); window._bf = setTimeout(() => { drawBatch(); const f = $("#bta-filter"); if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); } }, 250); } });

// stage headings take their number from the stage bar (stages were inserted and replaced)
STAGES.forEach(([id], i) => { const f = V[id]; if (f) V[id] = (...a) => f(...a).replace(/<h1>\d+ · /, `<h1>${i + 1} · `); });

// Account: per-user API keys (stored encrypted in Supabase Vault). Loaded after live.js.
"use strict";
// ---------------------------------------------------------------- account: my API keys (stored encrypted in Supabase Vault)
const KEY_SERVICES = [
  ["linz", "LINZ Data Service", "https://data.linz.govt.nz/my/api/", "Parcels, titles, buildings and suburbs"],
  ["statsnz_ade", "Stats NZ Aotearoa Data Explorer", "https://portal.apis.stats.govt.nz/", "Census tables (subscription key; primary)"],
  ["statsnz_datafinder", "Stats NZ Datafinder", "https://datafinder.stats.govt.nz/my/api/", "SA2 and TA boundaries"],
  ["openmeteo", "Open-Meteo (optional)", "https://open-meteo.com/en/pricing", "Only for commercial use; the free tier needs no key"],
];
V.account = () => {
  setTimeout(loadKeys, 0);
  return `<h1>Account</h1><p class="lead">Signed in as <b>${esc(PROFILE.email)}</b> (${esc(PROFILE.role)}).</p>
  <h2>My API keys</h2><p class="small muted">Jobs you queue use your own keys where you set them, so they count against your own free-tier limits. Otherwise the project's keys are used. Keys are encrypted in Supabase Vault: you can replace or remove them but never read them back, and only the worker can decrypt them, for your jobs.</p>
  <div class="card scroll" id="keys-card"><p class="muted">Loading…</p></div>`;
};
async function loadKeys() {
  const el = $("#keys-card"); if (!el) return;
  const mine = await q(sb.from("user_api_keys").select("service,last4,updated_at"));
  el.innerHTML = `<table><thead><tr><th class="l">Service</th><th class="l">Used for</th><th class="l">Your key</th><th class="l">Set / replace</th><th></th></tr></thead><tbody>${KEY_SERVICES.map(([k, name, url, use]) => {
    const m = mine.find((x) => x.service === k);
    return `<tr><td class="l"><a href="${url}" target="_blank" rel="noopener">${name}</a></td><td class="l small" style="white-space:normal">${use}</td>
      <td class="l">${m ? `<code>••••${esc(m.last4)}</code> <span class="small muted">${esc(new Date(m.updated_at).toLocaleDateString())}</span>` : '<span class="muted">project key</span>'}</td>
      <td class="l"><input type="password" autocomplete="off" data-keyin="${k}" placeholder="paste key" style="width:180px"> <button class="btn" data-keysave="${k}" type="button">Save</button></td>
      <td>${m ? `<button class="btn" data-keydel="${k}" type="button">Remove</button>` : ""}</td></tr>`; }).join("")}</tbody></table>`;
}
document.addEventListener("click", async (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.keysave) { const inp = $(`[data-keyin="${t.dataset.keysave}"]`); const v = inp.value; inp.value = "";
    try { const last4 = await q(sb.rpc("set_my_api_key", { p_service: t.dataset.keysave, p_key: v })); toastMsg(`Saved (••••${last4})`); loadKeys(); } catch (err) { toastMsg("Not saved: " + err.message); } }
  if (t.dataset && t.dataset.keydel) { if (!confirm("Remove this key? Your jobs will use the project key.")) return;
    try { await q(sb.rpc("delete_my_api_key", { p_service: t.dataset.keydel })); toastMsg("Removed"); loadKeys(); } catch (err) { toastMsg(err.message); } }
});
